name: adJ Validation

on:
  push:
    branches: [ expgh, ADJ_* ]
  pull_request:
    branches: [ expgh, ADJ_* ]

jobs:
  validate-scripts:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies and compile oksh
      run: |
        sudo apt-get update
        sudo apt-get install -y genisoimage xorriso build-essential libncurses-dev
        
        # Compile oksh (portable OpenBSD ksh)
        cd /tmp
        git clone https://github.com/ibara/oksh.git
        cd oksh
        ./configure
        make
        echo "oksh compiled successfully at /tmp/oksh/oksh"
        /tmp/oksh/oksh -c 'echo "oksh version: $KSH_VERSION"'
    
    - name: Validate shell script syntax with oksh (OpenBSD ksh)
      run: |
        echo "=== Validating main scripts with oksh (portable OpenBSD ksh) ==="
        # oksh es el ksh portable de OpenBSD, comportamiento idéntico al original
        echo "Checking distribucion.sh..."
        if /tmp/oksh/oksh -n distribucion.sh; then
          echo "✓ distribucion.sh syntax OK with OpenBSD ksh"
        else
          echo "⚠ distribucion.sh has syntax errors"
          exit 1
        fi
        
        echo -e "\nChecking ver.sh..."
        if /tmp/oksh/oksh -n ver.sh; then
          echo "✓ ver.sh syntax OK with OpenBSD ksh"
        else
          echo "⚠ ver.sh has syntax errors"
          exit 1
        fi
        
        echo -e "\n=== Validating hdes scripts ==="
        find hdes/ -name "*.sh" -type f | while read script; do
          echo "Checking $script"
          if /tmp/oksh/oksh -n "$script"; then
            echo "✓ $script syntax OK"
          else
            echo "⚠ $script has syntax errors"
          fi
        done
        
        echo -e "\n=== Validating pruebas scripts ==="
        find pruebas/ -name "*.sh" -type f | while read script; do
          echo "Checking $script"
          if /tmp/oksh/oksh -n "$script"; then
            echo "✓ $script syntax OK"
          else
            echo "⚠ $script has syntax errors"
          fi
        done

    - name: Validate patch files
      run: |
        echo "=== Checking patch file syntax ==="
        find arboldes/usr/src/ -name "*.patch" -type f | while read patch; do
          echo "Validating $patch"
          # Check if patch has proper diff format
          if head -n 5 "$patch" | grep -q "^diff\|^---\|^+++"; then
            echo "✓ $patch appears to be a valid patch file"
          else
            echo "⚠ $patch may not be a valid patch file"
          fi
        done

    - name: Check directory structure
      run: |
        echo "=== Verifying expected directory structure ==="
        for dir in arboldd arboldes arboldvd arbolexp doc hdes pruebas tminiroot; do
          if [ -d "$dir" ]; then
            echo "✓ $dir exists"
          else
            echo "⚠ $dir missing"
          fi
        done

    - name: Validate configuration files
      run: |
        echo "=== Checking configuration files ==="
        if [ -f "ver.sh" ]; then
          echo "✓ ver.sh exists"
          # Check for required variables
          if grep -q "^V=" ver.sh; then
            echo "✓ Version variable found"
          fi
        fi
        
        if [ -f "ver-local.sh.plantilla" ]; then
          echo "✓ ver-local.sh.plantilla exists"
        fi

    - name: Documentation check
      run: |
        echo "=== Checking documentation files ==="
        for doc in README.md ComoPublicar.md Novedades.md; do
          if [ -f "$doc" ]; then
            echo "✓ $doc exists"
            # Basic markdown validation
            if grep -q "^#" "$doc"; then
              echo "✓ $doc has markdown headers"
            fi
          else
            echo "⚠ $doc missing"
          fi
        done